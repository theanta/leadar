services:
  - type: web
    name: lead-radar-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false       # set in Render dashboard
      - key: APIFY_TOKEN
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false       # set to ["https://your-vercel-app.vercel.app"]
      - key: APP_ENV
        value: production
